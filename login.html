<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Form</title>
        <link id="themeStylesheet" href="styles/login.css" rel="stylesheet" >
    </head>
    <body>
        <img src="assets/image 4.png" alt="Logo" class="logo">
        <h1> Login to Your Account </h1>
        <div class="form_container">
            <form id="loginForm">
                <input type="email" id="email" name="email" placeholder="Email" required><br>
              <br>
                <input type="password" id="password" name="password" placeholder="Password" required><br><br>
                <button type="submit" id="login" class="black_button">Login</button>
            </form>
            <div class="signup_link">
            <p> Don't have an account? <a href="signup.html"> Create One </a></p>
            </div>
            <img src="assets/darkTheme-removebg-preview 2.png" alt="Dark Theme Image" class="dark_theme_image" id="themeToggle">
        </div>
        <script type="module" src="script.js" ></script>
    </body>
</html>
