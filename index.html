<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List</title>
        <link id="themeStylesheet" href="styles/style.css" rel="stylesheet">
    </head>
    <body>
        <img src="assets/image 4.png" alt="Logo" class="logo">
        <p id="nameofuser">Welcome back to your To-do list, Username!</p>
        <p id="userStatus">Checking login status...</p>
        <p id="date">Today's Date: </p>
        <img src="assets/darkTheme-removebg-preview 2.png" alt="Dark Theme Image" class="dark_theme_image" id="themeToggle">
        <div>
            <div>
                
                <p>Filter</p>
                <button id="all">All</button>
                <button id="completed">Completed</button>
                <button id="pending">Pending</button>
            </div>
            
            
            
        </div>
        <!--Add a Task-->
        <form id="addTask">
            <label for="title">Task:</label><br>
            <input type="text" id="title" name="title" placeholder="Enter A Task" required><br>

            <label for="title">Due Date:</label><br>
            <input type="date" id="due" name="title" placeholder="Enter A Date" required><br><br>

            <label for="priority">Priority:</label><br>
            <select id="priority" name="priority" required>
                <option value="">Select Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select><br><br>
            <button type="submit" class="black_button">Add Task</button>
        </form>

        <br>
        <button id="logoutBtn" class="black_button">Logout</button>
        
        <p>List</p>
        <hr>
        <div class="list">
                <ul id="taskList"><!--Mark Task Complete--><!--Displayed Tasks--><!--Delete Task--></ul>
        </div>

        
        <script type="module" src="script.js"></script>
    </body>
</html>
