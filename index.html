<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <h1>To-Do List</h1>
        <p id="userStatus">Checking login status...</p>
        <div>
            <div>
                <p>List</p>
                <p>Filter</p>
                <button>All</button>
                <button>Completed</button>
                <button>Pending</button>
            </div>
            <div class="list">
                <ul id="taskList"><!--Mark Task Complete--><!--Displayed Tasks--><!--Delete Task--></ul>
            </div>
            
            
        </div>
        <!--Add a Task-->
        <form id="addTask">
            <label for="title">Task:</label><br>
            <input type="text" id="title" name="title" placeholder="Enter A Task" required><br>

            <label for="title">Due Date:</label><br>
            <input type="date" id="due" name="title" placeholder="Enter A Date" required><br><br>

            <button type="submit" class="black_button">Add Task</button>
        </form>

        <br>
        <button id="logoutBtn" class="black_button">Logout</button>

        <script type="module" src="script.js"></script>
    </body>
</html>
