<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="login.css" rel="stylesheet">
        <title>Signup Form</title>
    </head>
    <body>
        <h1> Dont have an account yet?</h1>
        <h5> Let us help you improve those task management skills. </h5>
        <h2> Signup </h2>
        <div class="form_container">
            <form id="signupForm">
                <label for="usernm">Username:</label><br>
                <input type="text" id="usernm" name="username" required><br>
                <label for="email">Please enter a valid Emal:</label><br>
                <input type="email" id="email" name="email" placeholder="Email" required><br>
                <label for="password">Create personal password:</label><br>
                <input type="password" id="password" name="password" placeholder="Password" required><br><br>
                <button type="submit" id="signup" class="black_button">Sign Up</button>
            </form>
            <p> Have an account? <a href="login.html"> Log In </a></p>
        </div>
        <script type="module" src="script.js"></script>
    </body>
</html>
